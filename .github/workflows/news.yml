name: Update news

on:
  schedule:
    - cron: "17,47 * * * *"   # every 30 minutes
  push:
    branches: [main]
    paths: ["update_news.py", ".github/workflows/news.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draw app icons (first run only)
        run: |
          if [ ! -f icon-180.png ]; then pip install -q pillow && python make_icons.py; fi
      - name: Fetch news, write dialogue and translations
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_news.py
      - name: Save
        run: |
          git config user.name "ops-room-bot"
          git config user.email "ops-room-bot@users.noreply.github.com"
          git add news*.json icon-*.png
          git diff --cached --quiet && exit 0
          git commit -m "News update $(date -u +%FT%TZ)"
          git pull --rebase -X ours || true
          git push
